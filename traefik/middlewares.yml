    #   task webserver:dashboard-password
    # Après changement : redéployer (`task webserver:deploy`).
    dashboard-auth:
      basicauth:
        users:
          - 'admin:$apr1$CxmLfDU0$QXbuG61HWkH22j.8Wo7v01'
