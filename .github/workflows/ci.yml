name: CI Pipeline

on: 
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_INTERACTIVE: false
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  STACK_NAME: webserver
  DOCKER_COMPOSE_VERSION: '2.29.7'
  # Optimisations npm
  NPM_CONFIG_PROGRESS: false
  # Optimisations Docker
  DOCKER_CLI_EXPERIMENTAL: enabled

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2

      # Note : pas de cache actions/cache sur node_modules — setup-node met
      # déjà en cache le cache npm, et `npm ci` rend tout node_modules
      # restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci

      - name: lint all
        run: |
          task env:init
          task env:validate
          task lint:all

  launch:
    name: Launch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2

      # Note : pas de cache actions/cache sur node_modules — setup-node met
      # déjà en cache le cache npm, et `npm ci` rend tout node_modules
      # restauré obsolète/dangereux.
      - name: Install dependencies
        run: npm ci

      - name: Initialize Docker environment
        run: |
          echo "🐳 Initialisation de l'environnement Docker..."
          task env:init
          task env:validate
          task webserver:swarm-init
          task webserver:create-network
          task webserver:getpull-image
          task webserver:deploy
          task webserver:waiting
          echo "✅ Stack déployée"
